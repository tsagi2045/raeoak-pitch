<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e763c" />
<title>라이옥 LP 피드백 (260509)</title>
<style>
  :root {
    --green: #0e763c;
    --green-soft: #e6f4eb;
    --yellow: #d97706;
    --yellow-soft: #fef3c7;
    --gray: #6b6b70;
    --gray-soft: #f2f2f4;
    --red: #c5283d;
    --red-soft: #fde8ec;
    --ink: #111114;
    --muted: #6e6e74;
    --line: #e6e6ea;
    --bg: #fafafa;
    --card: #ffffff;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  body { padding-bottom: calc(120px + var(--safe-bottom)); }
  header.app {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header.app h1 { margin: 0 0 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  header.app .sub { color: var(--muted); font-size: 12px; line-height: 1.4; }
  header.app .progress { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  header.app .bar { flex: 1; min-width: 120px; height: 6px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; }
  header.app .bar > i { display: block; height: 100%; background: var(--green); width: 0%; transition: width .2s ease; border-radius: 999px; }
  header.app .count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); white-space: nowrap; }
  header.app .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  header.app .actions button {
    flex: 1; min-width: 0; padding: 9px 6px; border: 1px solid var(--line);
    background: #fff; border-radius: 10px; font-size: 11.5px; color: var(--ink);
    cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }
  header.app .actions button:active { background: var(--gray-soft); }
  header.app .actions button.danger { color: var(--red); }
  main { padding: 14px 14px 0; max-width: 720px; margin: 0 auto; }
  section.group {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin: 0 0 12px; overflow: hidden; box-shadow: var(--shadow);
  }
  details > summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { font-size: 12px; color: var(--muted); transition: transform .2s; }
  details[open] > summary .chev { transform: rotate(90deg); }
  details > summary .title { flex: 1; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  details > summary .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .group .body { padding: 0 14px 12px; }
  .item { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  .item .id-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .item .badge {
    font-size: 11px; padding: 2px 7px; background: var(--gray-soft); color: var(--muted);
    border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .item .ts {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .item .state-pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    margin-left: auto;
  }
  .item .state-apply  { background: var(--green-soft); color: var(--green); }
  .item .state-modify { background: var(--yellow-soft); color: var(--yellow); }
  .item .state-defer  { background: var(--gray-soft); color: var(--gray); }
  .item .state-skip   { background: var(--red-soft); color: var(--red); }
  .item h3 { margin: 2px 0 4px; font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.4; }
  .item .quote {
    margin: 4px 0 8px; padding: 8px 10px; background: var(--gray-soft);
    border-radius: 8px; color: #444; font-size: 12.5px; line-height: 1.5;
  }
  .item .quote b { color: var(--ink); font-weight: 600; }
  .item .suggest { margin: 4px 0 10px; font-size: 13px; color: #2a2a2e; }
  .item .suggest::before { content: "💡 "; }
  .item .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .item .btns button {
    padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; font-size: 12.5px; font-weight: 600; color: var(--ink);
    cursor: pointer; min-height: 40px; touch-action: manipulation;
    transition: transform .08s ease;
  }
  .item .btns button:active { transform: scale(0.97); }
  .item .btns button.on.apply  { background: var(--green); color: #fff; border-color: var(--green); }
  .item .btns button.on.modify { background: var(--yellow); color: #fff; border-color: var(--yellow); }
  .item .btns button.on.defer  { background: var(--gray); color: #fff; border-color: var(--gray); }
  .item .btns button.on.skip   { background: var(--red); color: #fff; border-color: var(--red); }
  .item .note {
    width: 100%; margin-top: 8px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 13px; resize: vertical;
    min-height: 56px; background: #fff;
  }
  .item .note:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .item .note-hint { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .add-row { padding: 12px 0; }
  .add-row textarea {
    width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 10px;
    font: inherit; font-size: 13px; min-height: 64px; background: #fff;
  }
  .add-row .add-section {
    width: 100%; margin-top: 6px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 13px; background: #fff;
  }
  .add-row .row { display: flex; gap: 6px; margin-top: 6px; }
  .add-row button {
    padding: 9px 12px; border: 1px solid var(--green); background: var(--green); color: #fff;
    border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .add-row button.ghost { background: #fff; color: var(--green); }
  .add-list { display: flex; flex-direction: column; gap: 6px; }
  .add-list .pill {
    display: flex; gap: 8px; padding: 8px 10px; background: var(--gray-soft);
    border-radius: 8px; font-size: 12.5px; align-items: flex-start;
  }
  .add-list .pill .sec { color: var(--green); font-weight: 600; flex-shrink: 0; }
  .add-list .pill .rm {
    margin-left: auto; border: none; background: transparent; color: var(--red);
    font-weight: 700; cursor: pointer; padding: 0 2px;
  }
  footer.bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 12px 14px calc(12px + var(--safe-bottom));
  }
  footer.bar .stats {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
    font-size: 12px; color: var(--muted);
  }
  footer.bar .stats b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  footer.bar .submit {
    width: 100%; padding: 14px; background: var(--green); color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  footer.bar .submit:disabled { opacity: .5; cursor: not-allowed; }
  footer.bar .submit:active:not(:disabled) { background: #0b5f30; }
  .toast {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%) translateY(8px);
    background: #111; color: #fff; padding: 11px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 40;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal.show { display: flex; }
  .modal .sheet {
    width: 100%; max-width: 720px; background: #fff; border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + var(--safe-bottom));
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal p.note { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .modal textarea {
    width: 100%; flex: 1; min-height: 220px; padding: 10px;
    border: 1px solid var(--line); border-radius: 10px;
    font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    resize: none; background: #fafafa; color: var(--ink);
  }
  .modal .actions { display: flex; gap: 8px; margin-top: 10px; }
  .modal .actions button {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .modal .actions .primary { background: var(--green); color: #fff; border-color: var(--green); }
  .info {
    margin: 0 0 12px; padding: 10px 12px; background: #fff8e1; color: #6b4f00;
    border: 1px solid #ffe8a3; border-radius: 10px; font-size: 12.5px;
  }
  @media (min-width: 720px) {
    body { padding-bottom: 110px; }
    .item .btns { grid-template-columns: repeat(4, minmax(0, 130px)); }
  }
</style>
</head>

// ─────────── 상태 관리 ───────────
const STORAGE_KEY = "raeoak-feedback-260509";
const TOTAL = GROUPS.reduce((n, g) => n + g.items.length, 0);
document.getElementById("total").textContent = String(TOTAL);

const STATE = {
  decisions: {},   // { id: { decision, note } }
  additional: [],  // [{ text, section }]
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      STATE.decisions = parsed.decisions || {};
      STATE.additional = Array.isArray(parsed.additional) ? parsed.additional : [];
    }
  } catch (e) { console.warn("load fail", e); }
}
let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
    catch (e) { console.warn("save fail", e); }
  }, 250);
}

// ─────────── 렌더링 ───────────
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

function renderItem(item) {
  const current = STATE.decisions[item.id] || { decision: null, note: "" };

  const noteEl = el("textarea", {
    class: "note",
    placeholder: "선택 입력 — 수정 카피, 추가 코멘트, 보류 사유 등",
    rows: 2,
  });
  noteEl.value = current.note || "";
  noteEl.addEventListener("input", () => {
    if (!STATE.decisions[item.id]) STATE.decisions[item.id] = { decision: null, note: "" };
    STATE.decisions[item.id].note = noteEl.value;
    saveState();
  });

  const pill = el("span", { class: "state-pill" });
  function refreshPill() {
    const d = STATE.decisions[item.id]?.decision;
    pill.className = "state-pill" + (d ? " state-" + d : "");
    pill.textContent = d === "apply" ? "반영" : d === "modify" ? "수정" : d === "defer" ? "보류" : d === "skip" ? "스킵" : "";
  }
  refreshPill();

  const btnsWrap = el("div", { class: "btns" });
  const opts = [
    { val: "apply",  label: "반영" },
    { val: "modify", label: "수정" },
    { val: "defer",  label: "보류" },
    { val: "skip",   label: "스킵" },
  ];
  const buttons = {};
  for (const opt of opts) {
    const b = el("button", { type: "button", "data-val": opt.val }, opt.label);
    b.addEventListener("click", () => {
      if (!STATE.decisions[item.id]) STATE.decisions[item.id] = { decision: null, note: noteEl.value };
      const prev = STATE.decisions[item.id].decision;
      const next = prev === opt.val ? null : opt.val;
      STATE.decisions[item.id].decision = next;
      refreshButtons();
      refreshPill();
      saveState();
      refreshTotals();
    });
    buttons[opt.val] = b;
    btnsWrap.appendChild(b);
  }
  function refreshButtons() {
    const d = STATE.decisions[item.id]?.decision;
    for (const opt of opts) {
      const on = d === opt.val;
      buttons[opt.val].className = on ? "on " + opt.val : "";
    }
  }
  refreshButtons();

  return el("div", { class: "item", "data-id": item.id },
    el("div", { class: "id-row" },
      el("span", { class: "badge" }, item.id),
      el("span", { class: "ts" }, item.ts || ""),
      pill,
    ),
    el("h3", null, item.title),
    item.quote ? el("div", { class: "quote", html: "<b>전사록</b> · " + escapeHtml(item.quote) }) : null,
    item.suggest ? el("div", { class: "suggest" }, item.suggest) : null,
    btnsWrap,
    noteEl,
    el("span", { class: "note-hint" }, "수정 선택 시 어떻게 바꿀지 메모해 주세요. 보류·스킵은 사유만 적어도 됩니다."),
  );
}

function renderGroup(g) {
  const body = el("div", { class: "body" });
  for (const item of g.items) body.appendChild(renderItem(item));

  const details = el("details", { open: "" },
    el("summary", null,
      el("span", { class: "chev" }, "▶"),
      el("span", { class: "title" }, g.key + ". " + g.name),
      el("span", { class: "meta" }, g.items.length + "개"),
    ),
    body,
  );
  return el("section", { class: "group" }, details);
}

function renderAdditional() {
  const list = el("div", { class: "add-list" });
  function refreshList() {
    list.innerHTML = "";
    STATE.additional.forEach((it, idx) => {
      list.appendChild(el("div", { class: "pill" },
        el("span", { class: "sec" }, it.section || "기타"),
        el("span", null, it.text),
        el("button", { class: "rm", "aria-label": "삭제", onclick: () => {
          STATE.additional.splice(idx, 1); saveState(); refreshList(); refreshTotals();
        }}, "×"),
      ));
    });
  }
  refreshList();

  const text = el("textarea", { placeholder: "전사록에 없는 추가 의견을 자유롭게 입력 (예: Counter 12개 → 13개로 수정)" });
  const sec = el("input", { class: "add-section", type: "text", placeholder: "어느 섹션에 대한 의견인지 (예: Hero, Counter, FAQ 등)" });
  const addBtn = el("button", { type: "button", onclick: () => {
    const t = text.value.trim();
    if (!t) return;
    STATE.additional.push({ text: t, section: sec.value.trim() || "기타" });
    text.value = ""; sec.value = "";
    saveState(); refreshList(); refreshTotals();
    toast("추가 항목 등록");
  }}, "+ 추가");

  const body = el("div", { class: "body" },
    el("div", { class: "add-row" },
      list,
      text,
      sec,
      el("div", { class: "row" }, addBtn),
    ),
  );
  return el("section", { class: "group" },
    el("details", { open: "" },
      el("summary", null,
        el("span", { class: "chev" }, "▶"),
        el("span", { class: "title" }, "+ 추가 의견 (자유 입력)"),
        el("span", { class: "meta" }, "선택"),
      ),
      body,
    ),
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderAll() {
  const root = document.getElementById("groups");
  root.innerHTML = "";
  for (const g of GROUPS) root.appendChild(renderGroup(g));
  root.appendChild(renderAdditional());
}

// ─────────── 총계 / 진행률 ───────────
function refreshTotals() {
  let apply = 0, modify = 0, defer = 0, skip = 0;
  for (const id of Object.keys(STATE.decisions)) {
    const d = STATE.decisions[id]?.decision;
    if (d === "apply") apply++;
    else if (d === "modify") modify++;
    else if (d === "defer") defer++;
    else if (d === "skip") skip++;
  }
  const done = apply + modify + defer + skip;
  const pending = TOTAL - done;
  document.getElementById("done").textContent = String(done);
  document.getElementById("stat-done").textContent = String(done);
  document.getElementById("stat-pending").textContent = String(pending);
  document.getElementById("stat-summary").textContent =
    `반영 ${apply} · 수정 ${modify} · 보류 ${defer} · 스킵 ${skip}` +
    (STATE.additional.length ? ` · 추가 ${STATE.additional.length}` : "");
  document.getElementById("bar").style.width = (TOTAL ? (done / TOTAL * 100) : 0) + "%";
  document.getElementById("btn-submit").disabled = done === 0 && STATE.additional.length === 0;
}

// ─────────── 일괄 액션 ───────────
function bulkSet(decision) {
  for (const g of GROUPS) for (const it of g.items) {
    if (!STATE.decisions[it.id]) STATE.decisions[it.id] = { decision: null, note: "" };
    STATE.decisions[it.id].decision = decision;
  }
  saveState();
  renderAll();
  refreshTotals();
}

document.getElementById("btn-all-apply").onclick = () => {
  if (confirm("31개 항목을 모두 '반영'으로 설정합니다. 진행할까요?")) bulkSet("apply");
};
document.getElementById("btn-all-defer").onclick = () => {
  if (confirm("31개 항목을 모두 '보류'로 설정합니다.")) bulkSet("defer");
};
document.getElementById("btn-reset").onclick = () => {
  if (confirm("모든 결정을 초기화합니다. 되돌릴 수 없습니다.")) {
    STATE.decisions = {}; STATE.additional = [];
    localStorage.removeItem(STORAGE_KEY);
    renderAll(); refreshTotals();
    toast("초기화 완료");
  }
};
document.getElementById("btn-expand").onclick = () => {
  document.querySelectorAll("details").forEach((d) => d.open = true);
};
document.getElementById("btn-collapse").onclick = () => {
  document.querySelectorAll("details").forEach((d) => d.open = false);
};

// ─────────── 토스트 ───────────
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ─────────── JSON 빌드 + 제출 ───────────
function buildJSON() {
  const items = [];
  for (const g of GROUPS) {
    for (const it of g.items) {
      const d = STATE.decisions[it.id];
      if (!d || !d.decision) continue;
      items.push({
        id: it.id,
        section: g.name,
        label: it.title,
        transcript_ts: it.ts || null,
        decision: d.decision,
        note: (d.note || "").trim(),
      });
    }
  }
  const summary = { apply: 0, modify: 0, defer: 0, skip: 0, total: TOTAL };
  for (const x of items) summary[x.decision]++;
  summary.decided = items.length;
  summary.pending = TOTAL - items.length;

  return {
    session: "260509-zoom-feedback",
    target: "raeoak-franchise-landing.vercel.app",
    submitted_at: new Date().toISOString(),
    summary,
    items,
    additional_items: STATE.additional.slice(),
  };
}

async function submit() {
  const payload = buildJSON();
  const text = "```json\n" + JSON.stringify(payload, null, 2) + "\n```";
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch (e) {
    console.warn("clipboard fail", e);
  }
  const modal = document.getElementById("modal");
  document.getElementById("modal-text").value = text;
  modal.classList.add("show");
  if (copied) toast("클립보드 복사 완료. 채팅창에 붙여넣어 주세요.");
  else toast("자동 복사 실패 — 텍스트를 직접 복사하세요.");
}

document.getElementById("btn-submit").onclick = submit;
document.getElementById("modal-close").onclick = () => document.getElementById("modal").classList.remove("show");
document.getElementById("modal-copy").onclick = async () => {
  const ta = document.getElementById("modal-text");
  try {
    await navigator.clipboard.writeText(ta.value);
    toast("복사 완료");
  } catch {
    ta.select(); document.execCommand?.("copy");
    toast("복사 시도 — 안되면 길게 눌러 직접 복사하세요");
  }
};
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") document.getElementById("modal").classList.remove("show");
});

// ─────────── 초기화 ───────────
loadState();
renderAll();
refreshTotals();
</script>
</body>
</html>
